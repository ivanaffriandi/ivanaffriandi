[tool.poetry]
name = "mail-platform-backend"
version = "1.0.0"
description = "Production-grade backend service for personal email platform ivanaffriandi.com"
authors = ["Ivan Affriandi <hello@ivanaffriandi.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
asyncpg = "^0.29.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
pyjwt = "^2.8.0"
argon2-cffi = "^23.1.0"
aiosmtplib = "^3.0.1"
aioimaplib = "^1.0.1"
mail-parser = "*"
email-validator = "^2.1.0"
bleach = "^6.1.0"
beautifulsoup4 = "^4.12.3"
redis = "^5.0.3"
prometheus-client = "^0.20.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"
black = "^24.3.0"
ruff = "^0.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
