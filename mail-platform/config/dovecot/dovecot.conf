# Dovecot Configuration for mail.ivanaffriandi.com

protocols = imap lmtp
listen = *

# Storage & Maildir Location
mail_location = maildir:/var/vmail/%d/%n:INDEX=/var/lib/dovecot/indexes/%d/%n
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = vmail

# SSL/TLS Configuration
ssl = yes
# ssl_cert = </etc/ssl/mail/cert.pem
# ssl_key = </etc/ssl/mail/key.pem
ssl_min_protocol = TLSv1.2
ssl_cipher_list = HIGH:!aNULL:!MD5:!DEF:!RC4:!DH
ssl_prefer_server_ciphers = yes

# Mailbox Default Folders (RFC 6154 SPECIAL-USE)
namespace inbox {
  inbox = yes

  mailbox INBOX {
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Spam {
    special_use = \Junk
    auto = subscribe
  }
}

# Authentication configuration via PostgreSQL
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# LMTP Service setup for local delivery from Postfix
service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port = 24
  }
}

# SASL Auth listener for Postfix submission
service auth {
  inet_listener {
    address = 0.0.0.0
    port = 12345
  }
}

# Logging
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stderr
